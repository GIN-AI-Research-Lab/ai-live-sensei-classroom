<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />

  <title>AI Live Sensei Classroom - Lộ trình Nhập môn → N1</title>

  <!-- Tailwind CSS & FontAwesome -->
  <!-- Tailwind ban LOCAL.
       Truoc day nap tu https://cdn.tailwindcss.com: may nao khong ra duoc Internet
       (vao qua LAN/Tailscale, mang cong ty chan CDN) la MAT TOAN BO class Tailwind
       -> layout vo tan, va ca class .hidden cung bien mat nen moi lop phu
       (bang cau hinh, o chat, spotlight, bang sua loi) hien ra cung luc. -->
  <!-- Bat loi tu SOM NHAT: truoc moi the script. Dat o day thi loi cu phap
       hay tep 404 cua bat ky tep nao ben duoi deu bi ghi lai, du tep chua
       luoi an toan (js/app.js) co chet di nua. -->
  <script>
    window.__loiSom = [];
    window.addEventListener('error', function (e) {
      if (e.target && e.target.tagName === 'SCRIPT') {
        window.__loiSom.push('khong tai duoc ' + (e.target.getAttribute('src') || '?'));
      } else if (e.message) {
        window.__loiSom.push(e.message + (e.filename ? ' @ ' + e.filename.split('/').pop() + ':' + e.lineno : ''));
      }
    }, true);
    window.addEventListener('unhandledrejection', function (e) {
      window.__loiSom.push('promise: ' + String((e.reason && e.reason.message) || e.reason).slice(0, 120));
    });
  </script>

  <script src="vendor/tailwind.js"></script>
  <script>
    /* ------------------------------------------------------------------
       Bang mau "giay be" (Paper Deck).

       Giao dien goc la dark theme, nen thang do slate duoc DAO NGUOC:
         slate-950/900 -> giay sang (nen trang, mat the)
         slate-100/200 -> muc dam (chu)
       Cac mau nhan giu nguyen quy uoc: 100-400 = chu dam,
       500-700 = nen dac (chu trang), 800-950 = nen nhat.
       Nho vay toan bo class Tailwind san co doi tong ma khong phai viet lai.
       ------------------------------------------------------------------ */
    /* Thieu vendor/tailwind.js thi bo qua phan chinh mau, dung de no nem
       ReferenceError — loi o day lam chet not nhung script chay sau.
       Ghi nho TRUOC khi tao vo rong, khong thi phep thu ben duoi luon dung. */
    window.__coTailwind = (typeof window.tailwind !== 'undefined');
    window.tailwind = window.tailwind || {};
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            ink: '#1f1d19',
            paper: '#f0ebe1',

            /* Cau truc: giay & muc */
            slate: {
              50:  '#14120f', 100: '#1f1d19', 200: '#2e2a24', 300: '#453e34',
              400: '#6b6355', 500: '#70675a', 600: '#b3a794', 700: '#d3c5af',
              800: '#e5dbcb', 900: '#faf7f2', 950: '#f0ebe1',
            },
            /* Nhan chinh: terracotta */
            indigo: {
              50:  '#fdf9f7', 100: '#5f2715', 200: '#7a331c', 300: '#964126',
              400: '#a9492b', 500: '#c96442', 600: '#b4543a', 700: '#9b4530',
              800: '#f2e0d7', 900: '#f6e7df', 950: '#fbf2ec',
            },
            /* Dung / thanh cong: xanh reu */
            emerald: {
              50:  '#f7faf5', 100: '#1e2b18', 200: '#2a3b22', 300: '#3e5c35',
              400: '#4c7040', 500: '#6b8a5e', 600: '#4f6d45', 700: '#3e5836',
              800: '#e3ecdd', 900: '#eaf0e5', 950: '#f3f7ef',
            },
            /* Sai / canh bao: dat nung */
            rose: {
              50:  '#fdf7f5', 100: '#3a1713', 200: '#4a1e18', 300: '#8b3628',
              400: '#a54331', 500: '#c25a4c', 600: '#ac4739', 700: '#913a2e',
              800: '#f3ddd7', 900: '#f7e5e0', 950: '#fcf3f0',
            },
            red: {
              50:  '#fdf7f5', 100: '#3a1713', 200: '#4a1e18', 300: '#8b3628',
              400: '#a54331', 500: '#c2503f', 600: '#ac4739', 700: '#913a2e',
              800: '#f3ddd7', 900: '#f7e5e0', 950: '#fcf3f0',
            },
            /* Luu y: vang nghe */
            amber: {
              50:  '#fdfaf2', 100: '#332510', 200: '#42300f', 300: '#7a5a18',
              400: '#8f6a1c', 500: '#c0952f', 600: '#9a7726', 700: '#7e611f',
              800: '#f2ecda', 900: '#f6eedc', 950: '#fbf6eb',
            },
            purple: {
              50:  '#fbf7fb', 100: '#3a2840', 200: '#4a3450', 300: '#5e3f63',
              400: '#6f4a74', 500: '#8a5e90', 600: '#744e79', 700: '#5e3f63',
              800: '#ece2ee', 900: '#f2eaf3', 950: '#f8f4f9',
            },
            /* Nhan tu loai trong the tu vung */
            blue:   { 300: '#33507a', 400: '#3d5c8a', 500: '#4a6fa5', 600: '#3d5c8a' },
            cyan:   { 300: '#1f5c5c', 400: '#24706e', 500: '#2f8a87' },
            teal:   { 300: '#1f5c5c', 400: '#24706e', 500: '#2f8a87' },
            pink:   { 300: '#8a3a5c', 400: '#9c4368', 500: '#b05078' },
            orange: { 300: '#8a4a1c', 400: '#a25a20', 500: '#c07a32' },
          },
          fontFamily: {
            sans:  ['Inter', 'Noto Sans JP', 'system-ui', 'Segoe UI', 'sans-serif'],
            serif: ['Noto Serif JP', 'Yu Mincho', 'Georgia', 'serif'],
          },
        }
      }
    }
  </script>
  <link rel="stylesheet" href="vendor/fontawesome/all.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- Font web nap KHONG chan ve trang: mang chan Google thi trang van hien ngay bang font he thong
       (display=swap). Chi lay dung cac nac dang dung: Inter 400-700, Noto Sans JP 400/500/700,
       Noto Serif JP 700 (chi cho chu hien thi lon). -->
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@700&display=swap" onload="this.onload=null;this.rel='stylesheet'" />
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@700&display=swap" /></noscript>
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/lesson.css" />
  <link rel="stylesheet" href="css/motion.css" />
  <link rel="stylesheet" href="css/motion-chu.css" />
  <link rel="stylesheet" href="css/motion-hoi.css" />
</head>
<body class="deck bg-slate-950 text-slate-100 font-sans antialiased">

  <!-- ====================================================================
       THANH TRÊN — chỉ danh tính bài học + 2 lối vào phụ
       ==================================================================== -->
  <header class="deck-top">
    <div class="deck-brand">
      <div class="deck-mark" aria-hidden="true">
        <i class="fa-solid fa-chalkboard-user"></i>
      </div>

      <div class="deck-id">
        <!-- 2 nhan duoi trung voi 2 o chon nen CSS an di; JS van ghi vao -->
        <span id="levelBadge" class="deck-level">N5</span>
        <span class="deck-lesson-no">Bài <span id="lessonNum">1</span></span>
        <!-- Cap do + bai dung canh nhau: "N5 · Bài 1: …" doc thanh mot danh tinh (Nhap mon: "Nhập môn · Bài 1") -->
        <select id="levelSelect" class="deck-level-select" title="Chọn trình độ" aria-label="Chọn trình độ">
          <option value="KANA">Nhập môn</option>
          <option value="N5" selected>N5</option>
          <option value="N4">N4</option>
          <option value="N3">N3</option>
          <option value="N2">N2</option>
          <option value="N1">N1</option>
        </select>
        <select id="lessonSelect" class="deck-lesson-select" title="Chọn bài học" aria-label="Chọn bài học"></select>
      </div>
    </div>

    <div class="deck-top-tools">
      <!-- Sensei đang nói (im lặng thì mờ đi; điện thoại: nằm đè lên logo, không chiếm chỗ tên bài) -->
      <div id="waveform" class="deck-wave" title="Giọng Sensei" aria-hidden="true">
        <div class="wave-bar"></div>
        <div class="wave-bar" style="animation-delay:.1s"></div>
        <div class="wave-bar" style="animation-delay:.2s"></div>
        <div class="wave-bar" style="animation-delay:.3s"></div>
        <div class="wave-bar" style="animation-delay:.4s"></div>
      </div>

      <button id="pickerBtn" class="ctl-icon" title="Chọn bài học khác" aria-label="Chọn bài học khác">
        <i class="fa-solid fa-table-cells-large"></i>
      </button>
    </div>
  </header>

  <!-- ====================================================================
       SÂN KHẤU — chiếm trọn phần còn lại của màn hình
       ==================================================================== -->
  <main class="deck-stage">
    <div class="deck-canvas">
      <div id="slideContent" class="deck-content">
        <div class="text-center py-20 text-slate-400">
          <i class="fa-solid fa-spinner fa-spin text-3xl mb-3 text-indigo-400"></i>
          <p>Đang nạp dữ liệu giáo trình tiếng Nhật...</p>
        </div>
      </div>
    </div>

    <!-- Bảng sửa lỗi realtime (tool mark_error) — nổi trên sân khấu -->
    <div id="errorDock" class="deck-errdock hidden">
      <div class="flex items-center justify-between font-bold text-rose-400 mb-2">
        <div class="flex items-center gap-2 text-xs uppercase tracking-wider">
          <i class="fa-solid fa-triangle-exclamation"></i>
          <span>Sensei ghi chú sửa lỗi</span>
        </div>
        <button id="dismissErrBtn" class="ctl-icon ctl-icon-sm" title="Đóng">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-2">
        <div class="deck-errcell">
          <span class="deck-errlabel">Bạn đã nói</span>
          <span id="errWrong" class="line-through text-rose-300 font-medium"></span>
        </div>
        <div class="deck-errcell deck-errcell-ok">
          <span class="deck-errlabel text-emerald-400">Sửa chuẩn</span>
          <span id="errCorrect" class="text-emerald-300 font-bold"></span>
        </div>
      </div>
      <p id="errExplain" class="deck-errnote"></p>
    </div>

    <!-- Chú thích highlight — phụ đề của sân khấu -->
    <div id="highlightNotice" class="deck-caption"></div>
  </main>

  <!-- ====================================================================
       THANH DƯỚI — điều khiển trình chiếu
       ==================================================================== -->
  <footer class="deck-bottom">
    <!-- 5 chương của bài học -->
    <nav class="deck-chapters" aria-label="Phân môn bài học">
      <button id="tabVocabBtn"   class="chapter" title="Từ vựng & Phát âm"><i class="fa-solid fa-book"></i><span>Từ vựng</span></button>
      <button id="tabKanjiBtn"   class="chapter" title="Chữ Hán Kanji & Từ ghép"><i class="fa-solid fa-square-pen"></i><span>Chữ Hán</span></button>
      <button id="tabGrammarBtn" class="chapter is-active" title="Ngữ pháp & Mẫu câu"><i class="fa-solid fa-diagram-project"></i><span>Ngữ pháp</span></button>
      <button id="tabKaiwaBtn"   class="chapter" title="Hội thoại thực tế"><i class="fa-solid fa-comments"></i><span>Hội thoại</span></button>
      <button id="tabQuizBtn"    class="chapter" title="Bài tập trắc nghiệm"><i class="fa-solid fa-list-check"></i><span>Bài tập</span></button>
      <button id="tabReflexBtn"  class="chapter" title="Phản xạ nhanh — viết và nói cấp tốc, Sensei chấm ngay"><i class="fa-solid fa-bolt"></i><span>Phản xạ</span></button>
    </nav>

    <!-- Điều hướng slide trong chương Ngữ pháp (chỉ hiện ở chương đó; phím ← → cũng dùng được) -->
    <div class="deck-nav">
      <button id="prevSlideBtn" class="ctl-icon ctl-icon-sm" title="Slide trước (←)" aria-label="Slide trước"><i class="fa-solid fa-chevron-left"></i></button>
      <span id="slideIndexLabel" class="deck-counter" aria-live="polite">Slide 1/1</span>
      <button id="nextSlideBtn" class="ctl-icon ctl-icon-sm" title="Slide sau (→)" aria-label="Slide sau"><i class="fa-solid fa-chevron-right"></i></button>
    </div>

    <!-- Điều khiển buổi học -->
    <div class="deck-actions">
      <button id="autoLectureBtn" class="ctl ctl-go" title="Sensei giảng tuần tự qua 5 phân môn">
        <i class="fa-solid fa-play" id="autoLectureIcon"></i>
        <span id="autoLectureText">Bắt đầu giảng bài</span>
      </button>

      <button id="nextStepBtn" class="ctl ctl-next hidden" title="Sang phần tiếp theo ngay">
        <span id="nextStepText">Tiếp theo</span>
      </button>

      <!-- Giơ tay hỏi: bấm để thu âm, sau đó chọn Gửi hoặc Hủy -->
      <button id="raiseHandBtn" class="ctl ctl-warn" title="Tạm dừng bài giảng để hỏi Sensei">
        <i class="fa-solid fa-hand" id="raiseHandIcon"></i>
        <span id="raiseHandText">Giơ tay hỏi</span>
      </button>

      <button id="askSendBtn" class="ctl ctl-go hidden" title="Gửi câu hỏi cho Sensei">
        <i class="fa-solid fa-paper-plane"></i>
        <span>Gửi câu hỏi</span>
      </button>

      <button id="askCancelBtn" class="ctl ctl-ghost hidden" title="Bỏ câu hỏi, Sensei giảng tiếp">
        <i class="fa-solid fa-xmark"></i>
        <span>Hủy</span>
      </button>

      <button id="boardToggleBtn" class="ctl-icon" title="Mở / cất bảng của Sensei" aria-label="Bảng của Sensei" aria-pressed="false">
        <i class="fa-solid fa-chalkboard"></i>
      </button>

      <button id="chatToggleBtn" class="ctl-icon" title="Gõ câu hỏi cho Sensei" aria-label="Gõ câu hỏi cho Sensei" aria-controls="chatDock" aria-expanded="false">
        <i class="fa-solid fa-keyboard"></i>
      </button>
    </div>

    <!-- Đang thu âm câu hỏi -->
    <div id="micVolumeWrapper" class="deck-recording hidden">
      <span class="rec-dot"></span>
      <span id="micStatusText">Đang thu âm câu hỏi…</span>
      <div class="deck-micbar"><div id="micVolumeBar"></div></div>
      <span id="micVolumePercent" class="deck-micpct">0%</span>
    </div>
  </footer>

  <!-- Ô gõ câu hỏi — trượt lên từ thanh dưới -->
  <div id="chatDock" class="deck-chatdock hidden">
    <i class="fa-solid fa-comment-dots text-indigo-400" aria-hidden="true"></i>
    <input id="chatInput" type="text" placeholder="Hỏi Sensei…" title="Gõ câu hỏi cho Sensei rồi nhấn Enter để gửi" enterkeyhint="send" class="deck-chatinput" aria-label="Câu hỏi cho Sensei" />
    <button id="sendChatBtn" class="ctl ctl-connect" title="Gửi" aria-label="Gửi câu hỏi"><i class="fa-solid fa-paper-plane"></i></button>
    <button id="chatCloseBtn" class="ctl-icon ctl-icon-sm" title="Đóng (Esc)" aria-label="Đóng ô gõ câu hỏi"><i class="fa-solid fa-xmark"></i></button>
  </div>


  <!-- Thông báo hệ thống / lỗi -->
  <div id="toastHost" class="deck-toasts"></div>

  <!-- ====================================================================
       Lộ trình 100 bài học
       ==================================================================== -->
  <!-- ====================================================================
       MÀN CHỌN BÀI HỌC — Nhập môn + N5 → N1, mỗi cấp một dải bài
       ==================================================================== -->
  <!-- Hop thoai phu kin: app.js dat inert cho phan phia sau khi mo, focus khong lot ra sau -->
  <div id="lessonPicker" class="picker" role="dialog" aria-modal="true" aria-labelledby="pickerTitle">
    <header class="picker-top">
      <div class="picker-brand">
        <div class="deck-mark" aria-hidden="true"><i class="fa-solid fa-chalkboard-user"></i></div>
        <div>
          <h1 id="pickerTitle" tabindex="-1">Chọn bài học</h1>
          <p>Lộ trình Nhập môn → N1 — bảng chữ kana, Minna no Nihongo &amp; Shin Kanzen Master</p>
        </div>
      </div>

      <div class="picker-tools">
        <!-- Nhay nhanh toi tung cap do (app.js gan su kien + danh dau cap dang xem) -->
        <nav id="pickerJump" class="deck-seg picker-jump" aria-label="Chuyển nhanh tới cấp độ">
          <button type="button" data-jump="KANA" title="Nhập môn — bảng chữ kana" lang="ja">かな</button>
          <button type="button" data-jump="N5">N5</button>
          <button type="button" data-jump="N4">N4</button>
          <button type="button" data-jump="N3">N3</button>
          <button type="button" data-jump="N2">N2</button>
          <button type="button" data-jump="N1">N1</button>
        </nav>
        <!-- label (khong phai div): cham vao le / bieu tuong kinh lup cua o cung dua focus vao o tim -->
        <label class="picker-search">
          <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
          <input id="pickerSearch" type="search" placeholder="Tìm bài, ngữ pháp, chủ đề…" autocomplete="off" aria-label="Tìm bài học theo số bài, mẫu ngữ pháp hoặc chủ đề" />
        </label>
        <button id="pickerCloseBtn" class="ctl-icon" title="Đóng, quay lại bài đang học (Esc)" aria-label="Đóng danh sách bài">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
    </header>

    <div id="pickerBody" class="picker-body custom-scrollbar"></div>
  </div>

  <!-- Phóng to tranh minh hoạ -->
  <!-- z-[96]: tren meo (3-4), the ron (80), thong bao (95) -->
  <div id="imageLightboxModal" class="hidden fixed inset-0 z-[96] bg-slate-950/85 backdrop-blur-md flex items-center justify-center p-4" role="dialog" aria-modal="true" aria-labelledby="lightboxTitle" onclick="window.closeImageLightbox(event)">
    <div class="bg-slate-900 border border-slate-700/80 rounded-2xl max-w-lg w-full p-4 shadow-2xl relative flex flex-col items-center gap-3 animate-zoom-in" onclick="event.stopPropagation()">
      <button onclick="window.closeImageLightbox()" class="ctl-icon ctl-icon-sm absolute -top-3 -right-3 shadow-lg" title="Đóng">
        <i class="fa-solid fa-xmark"></i>
      </button>
      <div class="w-full max-h-[60vh] overflow-hidden rounded-xl bg-slate-950/80 flex items-center justify-center p-1 border border-slate-800">
        <img id="lightboxImg" src="" alt="Minh họa phóng to" class="max-h-[56vh] w-auto object-contain rounded-lg shadow-md" />
      </div>
      <div class="w-full text-center px-2">
        <h4 id="lightboxTitle" class="text-base font-bold text-indigo-300 mb-1"></h4>
        <p id="lightboxCaption" class="text-xs text-slate-300 italic"></p>
      </div>
    </div>
  </div>

  <!-- Script Modules -->
  <!-- Sinh tu .env boi server.py -->
  <script src="env.js"></script>
  <script src="js/illustrations.js"></script>
  <!-- Lo minh hoa bo sung N5 — moi tep do mot dot soan rieng, tu goi SenseiArt.extend() -->
  <script src="js/illustrations-n5-batch1.js"></script>
  <script src="js/illustrations-n5-batch2.js"></script>
  <script src="js/illustrations-n5-batch3.js"></script>
  <script src="js/illustrations-n5-batch4.js"></script>

  <script src="js/illustrations-n4-batch1.js"></script>
  <script src="js/illustrations-n4-batch2a.js"></script>
  <script src="js/illustrations-n4-batch2b.js"></script>

  <!-- Lo minh hoa bo sung N3 -->
  <script src="js/illustrations-n3-batch1.js"></script>
  <script src="js/illustrations-n3-batch2.js"></script>
  <script src="js/illustrations-n3-batch3.js"></script>
  <script src="js/illustrations-n3-batch4.js"></script>
  <script src="js/illustrations-n3-batch5.js"></script>
  <script src="js/illustrations-n3-batch6.js"></script>
  <!-- Duong net chu Han (KanjiVG, CC BY-SA 3.0) + lop bang phan -->

  <!-- Net chu kana (hiragana, katakana, ー) cho cap Nhap mon: SenseiStrokes.get() tu tra sang day -->
  <script src="js/kana-strokes.js"></script>
  <script src="js/board.js"></script>
  <script src="js/voices.js"></script>
  <script src="js/voice-actors.js"></script>
  <script src="js/models.js"></script>

  <script src="js/slide-engine.js"></script>

  <script src="js/khau-hinh.js"></script>
  <script src="js/audio-engine.js"></script>
  <script src="js/gemini-live.js"></script>
  <script src="js/app.js"></script>
  <!-- Vo giao dien: do chieu cao thanh tren / duoi, dong bo trang thai nut, phim ← → -->

  <!-- San khau giang (motion design) + che do mo phong bai giang (?moPhong) -->

  <script src="js/phong-cach/chon.js"></script>
  <script src="js/mo-phong.js"></script>

  <!-- Sensei hoat hinh: meo clip nua than (js/sensei-cat-video.js).
       js/sensei-avatar-hub.js nap meo va chuyen lenh window.SenseiAvatar toi no;
       nut tron o goc phai de an / hien.
       Nap sau cung va chay rieng: loi o day khong lam chet bai hoc. -->
  <script src="js/sensei-avatar-hub.js"></script>

  <!-- ====================================================================
       CANH GAC TRANG TRANG

       Dat TRONG index.html chu khong trong app.js: tep nao chet truoc thi
       luoi an toan nam trong tep do cung chet theo. Doan nay khong phu thuoc
       tep ngoai nao nen luon chay duoc.

       Sau khi tai xong 7 giay, neu danh sach bai VAN trong thi bao ro: thieu
       tep nao, loi gi. Bat ke nguyen nhan, nguoi dung luon nhan duoc mot cau
       tra loi thay vi mot trang trang khong hieu gi.
       ==================================================================== -->
  <script>
    (function () {
      var CAN = [
        ['__coTailwind',     'vendor/tailwind.js',      'bang mau & class giao dien'],
        ['CurriculumLoader', 'js/curriculum-loader.js', 'giao trinh Nhap mon, N5-N1'],
        ['SlideEngine',      'js/slide-engine.js',      'bo dung man hinh bai hoc'],
        ['AudioEngine',      'js/audio-engine.js',      'am thanh'],
        ['GeminiLiveClient', 'js/gemini-live.js',       'phien hoc truc tuyen'],
        ['SenseiVoices',     'js/voices.js',            'giong nhan vat'],
        ['SenseiBoard',      'js/board.js',             'bang phan'],
        ['SenseiStrokes',    'js/kanji-strokes.js',     'net viet chu Han'],
      ];

      function coBaiHoc() {
        return document.querySelectorAll('#pickerBody .lesson-card').length > 0;
      }

      function bao() {
        if (coBaiHoc()) return;                                   // moi thu on
        if (document.getElementById('bangHongKhoiDong')) return;  // app da tu bao roi
        if (document.getElementById('bangCanhGac')) return;

        var thieu = CAN.filter(function (m) { return !window[m[0]]; });
        var loi = (window.__loiSom || []).slice(0, 4);

        var chiTiet = [];
        if (thieu.length) {
          chiTiet.push('Thiếu tệp: ' + thieu.map(function (m) { return m[1]; }).join(', '));
        }
        if (loi.length) chiTiet.push('Lỗi: ' + loi.join(' · '));
        if (!chiTiet.length) chiTiet.push('Tệp tải đủ nhưng danh sách bài vẫn trống — nhiều khả năng mạng đứt giữa chừng.');

        var el = document.createElement('div');
        el.id = 'bangCanhGac';
        el.className = 'hong-khoi-dong';
        el.innerHTML =
          '<strong>Chưa mở được danh sách bài học</strong>'
          + '<span>' + chiTiet.join(' — ') + '</span>'
          + '<button type="button">Tải lại trang</button>';
        el.querySelector('button').addEventListener('click', function () { location.reload(); });
        document.body.appendChild(el);
        console.error('[canh gac]', chiTiet.join(' | '));
      }

      function batDau() { setTimeout(bao, 7000); }
      if (document.readyState === 'complete') batDau();
      else window.addEventListener('load', batDau);
    })();
  </script>
</body>
</html>
